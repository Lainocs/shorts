theme: le_sais_tu

llm:
  model: openai/gpt-oss-120b
  temperature: 0.6

video:
  min_words: 70
  max_words: 450
  max_clip_segment_seconds: 8
  resolution: [1080, 1920]

tts:
  voice_model: assets/voices/fr_FR-siwis-medium.onnx
  voice_config: assets/voices/fr_FR-siwis-medium.onnx.json

subtitles:
  whisper_model: tiny

visuals:
  provider: pexels
  orientation: portrait

youtube:
  privacy_status: public
  category_id: "27" # Education
  client_secret_file: "Client Secret Le Sais-Tu.json"
  token_file: token.json

schedule:
  # Les heures réelles du cron sont définies dans scripts/install_cron.sh
  videos_per_day: 6

paths:
  output_dir: output
  state_db: state/history.sqlite3
  logs_dir: logs

alerts:
  webhook_url_env: ALERT_WEBHOOK_URL

retry:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]
